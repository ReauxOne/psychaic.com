<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Psychaic</title>
  <meta name="description" content="Art, ceramics and cross-stitch patterns about the future as it used to be imagined: chrome, sky, clay and the big questions of tomorrow.">
  <meta property="og:title" content="Psychaic">
  <meta property="og:description" content="The future, as it used to be imagined. Art, ceramics and patterns.">
  <meta property="og:url" content="https://psychaic.com/">
  <meta property="og:image" content="https://psychaic.com/images/satellite-01.jpg">
  <link rel="canonical" href="https://psychaic.com/">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#23264A" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Jost:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="js/intro.js" defer></script>
  <script src="js/portal.js" defer></script>
</head>
<body>
  <script>
    // Run the scroll intro only when motion is welcome; otherwise the page shows its finished scene.
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('intro-on');
  </script>
  <header class="top" id="top">
    <div class="wrap">
      <a class="logo" href="./" aria-label="Psychaic home">
        <svg class="orbit" viewBox="0 0 220 44" aria-hidden="true"><ellipse cx="110" cy="22" rx="107" ry="18"/><circle cx="208" cy="12" r="3.6"/></svg>
        <span>PSYCHAIC</span>
      </a>
    </div>
  </header>

  <main>
    <section class="intro" id="intro" aria-labelledby="intro-title">
      <h1 id="intro-title" class="visually-hidden">Psychaic: the future, as it used to be imagined</h1>
      <div class="stage">
        <div class="sky" id="sky"></div>
        <div class="ground" id="ground">
          <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <line x1="0" y1="7" x2="100" y2="7"/><line x1="0" y1="19" x2="100" y2="19"/><line x1="0" y1="38" x2="100" y2="38"/><line x1="0" y1="66" x2="100" y2="66"/>
            <line x1="50" y1="0" x2="-70" y2="100"/><line x1="50" y1="0" x2="-5" y2="100"/><line x1="50" y1="0" x2="28" y2="100"/><line x1="50" y1="0" x2="50" y2="100"/>
            <line x1="50" y1="0" x2="72" y2="100"/><line x1="50" y1="0" x2="105" y2="100"/><line x1="50" y1="0" x2="170" y2="100"/>
          </svg>
          <div class="shadow" id="shadow"></div>
        </div>
        <svg class="planet" id="planet" viewBox="-280 -170 560 340" role="group" aria-label="A chrome planet wrapped by an oxblood ring, floating in a blue sky above a red horizon">
          <defs>
            <radialGradient id="chrome" cx="38%" cy="32%" r="72%">
              <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.2" stop-color="#ECEEF0"/><stop offset="0.5" stop-color="#B7BDC4"/>
              <stop offset="0.76" stop-color="#5D636A"/><stop offset="0.9" stop-color="#3E444B"/><stop offset="1" stop-color="#A9AFB6"/>
            </radialGradient>
            <radialGradient id="rim" cx="50%" cy="50%" r="50%">
              <stop offset="0.72" stop-color="#141619" stop-opacity="0"/><stop offset="1" stop-color="#141619" stop-opacity="0.35"/>
            </radialGradient>
            <radialGradient id="glint" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
            </radialGradient>
            <clipPath id="ball"><circle r="100"/></clipPath>
            <linearGradient id="ground-reflect" x1="0" y1="0" x2="0" y2="1"><stop offset="0.3" stop-color="#5A0B16" stop-opacity="0.3"/><stop offset="1" stop-color="#5A0B16" stop-opacity="0.08"/></linearGradient>
            <filter id="soften" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.5"/></filter>
          </defs>
          <g id="ring-back-g" transform="rotate(-14)"><path id="ring-back" class="ring" pathLength="1" d="M -250 0 A 250 44 0 0 1 250 0"/></g>
          <g clip-path="url(#ball)">
            <circle r="100" fill="url(#chrome)"/>
            <g filter="url(#soften)">
              <path id="tint-sky" d="M -100 -100 H 100 V 16 Q 0 40 -100 16 Z" fill="#9CCBEA" opacity="0.22"/>
              <path id="tint-horizon" d="M -100 16 Q 0 40 100 16 L 100 26 Q 0 54 -100 26 Z" fill="#2A2E33" opacity="0.45"/>
              <path id="tint-ground" d="M -100 26 Q 0 54 100 26 V 100 H -100 Z" fill="url(#ground-reflect)" opacity="1"/>
            </g>
            <g id="seams" class="seams" transform="rotate(-14)"></g>
            <circle r="100" fill="url(#rim)"/>
            <circle cx="-36" cy="-40" r="34" fill="url(#glint)"/>
          </g>
          <g id="ring-front-g" transform="rotate(-14)"><path id="ring-front" class="ring" pathLength="1" d="M 250 0 A 250 44 0 0 1 -250 0"/><circle id="satellite" r="9" cx="246.8" cy="7.0" fill="#5A0B16"/></g>
        
          <a href="about.html" class="thing-about portal" data-tint="#5A0B16" aria-label="About Psychaic">
            <g transform="translate(241.2 -52.9)">
              <circle class="halo" r="15"/>
              <circle r="30" fill="transparent"/>
              <text class="svg-tag" x="-24" y="-30">ABOUT</text>
            </g>
          </a>
        </svg>
        <a class="thing orb-link orb-shop portal" href="shop.html" aria-label="Shop: Satellites cross-stitch patterns">
          <span class="tag">Shop</span>
          <span class="art">
            <svg viewBox="-110 -110 220 250" aria-hidden="true">
              <defs>
                <radialGradient id="o-shop" cx="36%" cy="30%" r="74%"><stop offset="0" stop-color="#FFF8EA"/><stop offset="0.2" stop-color="#EBD3A2"/><stop offset="0.5" stop-color="#AC8553"/><stop offset="0.76" stop-color="#573E28"/><stop offset="0.9" stop-color="#2E2014"/><stop offset="1" stop-color="#B8925E"/></radialGradient>
                <radialGradient id="o-shop-rim" cx="50%" cy="50%" r="50%"><stop offset="0.72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.3"/></radialGradient>
                <radialGradient id="o-shop-glint" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
                <radialGradient id="o-shop-shadow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1A0206" stop-opacity="0.7"/><stop offset="1" stop-color="#1A0206" stop-opacity="0"/></radialGradient>
              </defs>
              <ellipse class="orb-shadow" cx="0" cy="128" rx="78" ry="10" fill="url(#o-shop-shadow)"/>
              <g class="orb-body">
                <circle r="100" fill="url(#o-shop)"/>
                <circle r="100" fill="url(#o-shop-rim)"/>
                <circle cx="-36" cy="-40" r="34" fill="url(#o-shop-glint)"/>
              </g>
            </svg>
          </span>
        </a>
        <a class="thing orb-link orb-transmissions portal" href="transmissions.html" aria-label="Transmissions: notes from a future that never came">
          <span class="tag">Transmissions</span>
          <span class="art">
            <svg viewBox="-110 -110 220 250" aria-hidden="true">
              <defs>
                <radialGradient id="o-transmissions" cx="36%" cy="30%" r="74%"><stop offset="0" stop-color="#F6F2FF"/><stop offset="0.2" stop-color="#C8B8EC"/><stop offset="0.5" stop-color="#7A5DB0"/><stop offset="0.76" stop-color="#3B2766"/><stop offset="0.9" stop-color="#1C1233"/><stop offset="1" stop-color="#8C78C4"/></radialGradient>
                <radialGradient id="o-transmissions-rim" cx="50%" cy="50%" r="50%"><stop offset="0.72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.3"/></radialGradient>
                <radialGradient id="o-transmissions-glint" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
                <radialGradient id="o-transmissions-shadow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1A0206" stop-opacity="0.7"/><stop offset="1" stop-color="#1A0206" stop-opacity="0"/></radialGradient>
              </defs>
              <ellipse class="orb-shadow" cx="0" cy="128" rx="78" ry="10" fill="url(#o-transmissions-shadow)"/>
              <g class="orb-body">
                <circle r="100" fill="url(#o-transmissions)"/>
                <circle r="100" fill="url(#o-transmissions-rim)"/>
                <circle cx="-36" cy="-40" r="34" fill="url(#o-transmissions-glint)"/>
              </g>
            </svg>
          </span>
        </a>
        <a class="thing orb-link orb-work portal" href="work.html" aria-label="Work: Sky Inside ceramics">
          <span class="tag">Work</span>
          <span class="art">
            <svg viewBox="-110 -110 220 250" aria-hidden="true">
              <defs>
                <radialGradient id="o-work" cx="36%" cy="30%" r="74%"><stop offset="0" stop-color="#F1F4FF"/><stop offset="0.2" stop-color="#A9B8EA"/><stop offset="0.5" stop-color="#3A4FA6"/><stop offset="0.76" stop-color="#1D2B7A"/><stop offset="0.9" stop-color="#0B1240"/><stop offset="1" stop-color="#5977A8"/></radialGradient>
                <radialGradient id="o-work-rim" cx="50%" cy="50%" r="50%"><stop offset="0.72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.3"/></radialGradient>
                <radialGradient id="o-work-glint" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
                <radialGradient id="o-work-shadow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1A0206" stop-opacity="0.7"/><stop offset="1" stop-color="#1A0206" stop-opacity="0"/></radialGradient>
              </defs>
              <ellipse class="orb-shadow" cx="0" cy="128" rx="78" ry="10" fill="url(#o-work-shadow)"/>
              <g class="orb-body">
                <circle r="100" fill="url(#o-work)"/>
                <circle r="100" fill="url(#o-work-rim)"/>
                <circle cx="-36" cy="-40" r="34" fill="url(#o-work-glint)"/>
              </g>
            </svg>
          </span>
        </a>
        <p class="stage-foot">© 2026 Psychaic</p>
        <p class="hint" id="hint">Scroll</p>
      </div>
    </section>

  </main>


</body>
</html>
